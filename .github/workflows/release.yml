name: Release

# 在 GitHub 上发布 Release 后自动构建 win-x64 单文件程序并附加到该 Release。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build & attach win-x64 package
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release --filter "Category!=Performance"

      - name: Publish single-file exe
        run: dotnet publish src/ProductionDashboard -c Release -p:PublishProfile=win-x64 -o publish

      - name: Package
        shell: pwsh
        run: |
          $asset = "ProductionDashboard-$env:TAG-win-x64.zip"
          Copy-Item README.md, README.en.md, LICENSE -Destination publish
          Compress-Archive -Path publish/* -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" "$env:ASSET" --clobber
