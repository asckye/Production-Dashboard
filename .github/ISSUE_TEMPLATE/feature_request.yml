name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 现场遇到了什么场景或痛点? / What situation or pain point does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 截图、PLC 型号、产线规模等 / Screenshots, PLC model, line size, etc.
